<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f5f5f5;
      color: #222;
    }
    h1 { text-align: center; }
    .box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    input, button {
      padding: 8px;
      font-size: 14px;
      margin: 4px 0;
    }
    input { width: 100%; box-sizing: border-box; }
    button { cursor: pointer; }
    .btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
    }
    .task {
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .done { text-decoration: line-through; color: #999; }
    .hidden { display: none; }
    #message { color: red; min-height: 18px; }
  </style>
</head>
<body>

  <h1>Task Manager</h1>

  <!-- Блок входа -->
  <div class="box" id="loginBox">
    <input id="username" placeholder="Имя пользователя">
    <input id="password" type="password" placeholder="Пароль">
    <button class="btn" onclick="register()">Регистрация</button>
    <button class="btn" onclick="login()">Войти</button>
    <div id="message"></div>
  </div>

  <!-- Блок задач (скрыт, пока не вошли) -->
  <div class="box hidden" id="taskBox">
    <input id="newTask" placeholder="Новая задача">
    <button class="btn" onclick="createTask()">Добавить</button>
    <div id="taskList"></div>
  </div>

  <script>
    let token = "";

    // Регистрация: отправляем JSON на /users/register
    async function register() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const res = await fetch("/users/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username, password: password })
      });
      if (res.ok) {
        document.getElementById("message").textContent = "Готово! Теперь войдите.";
      } else {
        document.getElementById("message").textContent = "Ошибка регистрации";
      }
    }

    // Вход: логин идёт через форму, в ответ получаем токен
    async function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const form = new URLSearchParams();
      form.append("username", username);
      form.append("password", password);

      const res = await fetch("/users/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: form
      });

      if (res.ok) {
        const data = await res.json();
        token = data.access_token;
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("taskBox").classList.remove("hidden");
        loadTasks();
      } else {
        document.getElementById("message").textContent = "Неверный логин или пароль";
      }
    }

    // Получить и показать список задач (Read)
    async function loadTasks() {
      const res = await fetch("/tasks/", {
        headers: { "Authorization": "Bearer " + token }
      });
      const tasks = await res.json();

      const list = document.getElementById("taskList");
      list.innerHTML = "";
      for (const task of tasks) {
        const div = document.createElement("div");
        div.className = "task";

        const title = document.createElement("span");
        title.textContent = task.title + " (приоритет " + task.priority + ")";
        if (task.status === "завершено") {
          title.className = "done";
        }

        const buttons = document.createElement("div");
        const doneBtn = document.createElement("button");
        doneBtn.textContent = "✓";
        doneBtn.onclick = () => completeTask(task.id);
        const delBtn = document.createElement("button");
        delBtn.textContent = "✗";
        delBtn.onclick = () => deleteTask(task.id);
        buttons.appendChild(doneBtn);
        buttons.appendChild(delBtn);

        div.appendChild(title);
        div.appendChild(buttons);
        list.appendChild(div);
      }
    }

    // Создать задачу (Create)
    async function createTask() {
      const title = document.getElementById("newTask").value;
      if (!title) return;
      await fetch("/tasks/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ title: title })
      });
      document.getElementById("newTask").value = "";
      loadTasks();
    }

    // Отметить выполненной (Update — меняем статус)
    async function completeTask(id) {
      await fetch("/tasks/" + id, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ status: "завершено" })
      });
      loadTasks();
    }

    // Удалить задачу (Delete)
    async function deleteTask(id) {
      await fetch("/tasks/" + id, {
        method: "DELETE",
        headers: { "Authorization": "Bearer " + token }
      });
      loadTasks();
    }
  </script>

</body>
</html>
